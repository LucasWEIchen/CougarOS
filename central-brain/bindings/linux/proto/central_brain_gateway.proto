syntax = "proto3";

package centralbrain.binding.v1;

// Linux gRPC/RPC skeleton for the Central Brain semantic gateway.
//
// Req IDs:
// - XSC-002 Uni Info Bus semantic interface
// - XSC-003 SOA service entry
// - XSC-001 AI SDK application facade
// - XSC-005 Runtime & Governance
// - XSC-006 Protocol Binding
// - APP-004 App access to model routing through AI SDK
// - FW-U-003 Uni Info Bus Event
// - FW-U-004 Uni Info Bus Action
// - FW-U-006 Tool / Skill contract
// - FW-U-008 Uni Info Bus extension mechanism
// - NV-P-003 gRPC/RPC binding
// - NV-P-006 DDS/high-rate topic reservation
// - DEL-002 Linux synchronized delivery path
// - DEL-003/004/005 delivery documentation, platform delta, and Driver/HAL visibility

service CentralBrainGateway {
  rpc GetContext(GatewayRequest) returns (GatewayResponse);
  rpc GetState(GatewayRequest) returns (GatewayResponse);
  rpc ListEventTopics(GatewayRequest) returns (GatewayResponse);
  rpc PublishEvent(GatewayRequest) returns (GatewayResponse);
  rpc GetRecentEvents(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptions(GatewayRequest) returns (GatewayResponse);
  rpc RequestEventSubscription(GatewayRequest) returns (GatewayResponse);
  rpc CancelEventSubscription(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionTransportReadiness(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionDecisionMatrix(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionActivationChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionCallbackWatchShape(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionCursorReplayStorage(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionBackpressureQosEvidence(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionReadinessRollup(GatewayRequest) returns (GatewayResponse);
  rpc SubmitEventSubscriptionActivationEvidence(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionActivationEvidenceStatus(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionActivationEvidenceRetentionChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetEventSubscriptionActivationEvidenceDecisionStatusRollup(GatewayRequest) returns (GatewayResponse);
  rpc GetUibExtensions(GatewayRequest) returns (GatewayResponse);
  rpc GetAiSdkCapabilities(GatewayRequest) returns (GatewayResponse);
  rpc PlanAgentTask(GatewayRequest) returns (GatewayResponse);
  rpc ExecuteAgentTask(GatewayRequest) returns (GatewayResponse);
  rpc ListSkills(GatewayRequest) returns (GatewayResponse);
  rpc InvokeSkill(GatewayRequest) returns (GatewayResponse);
  rpc QueryMemory(GatewayRequest) returns (GatewayResponse);
  rpc RequestAction(GatewayRequest) returns (GatewayResponse);
  rpc ListServices(GatewayRequest) returns (GatewayResponse);
  rpc GetServiceContracts(GatewayRequest) returns (GatewayResponse);
  rpc InvokeService(GatewayRequest) returns (GatewayResponse);
  rpc EvaluatePolicy(GatewayRequest) returns (GatewayResponse);
  rpc PrecheckGovernance(GatewayRequest) returns (GatewayResponse);
  rpc GetGovernanceBackendContract(GatewayRequest) returns (GatewayResponse);
  rpc GetGovernanceMigrationCheck(GatewayRequest) returns (GatewayResponse);
  rpc GetGovernanceDeploymentPlan(GatewayRequest) returns (GatewayResponse);
  rpc GetRuntimeGovernance(GatewayRequest) returns (GatewayResponse);
  rpc GetRecentAudit(GatewayRequest) returns (GatewayResponse);
  rpc ListBindings(GatewayRequest) returns (GatewayResponse);
  rpc GetBindingReadiness(GatewayRequest) returns (GatewayResponse);
  rpc GetDeliveryReadiness(GatewayRequest) returns (GatewayResponse);
  rpc GetPrototypeReadiness(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaces(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceActivationChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionStatus(GatewayRequest) returns (GatewayResponse);
  rpc SubmitHardwareInterfaceOwnerDecisionEvidence(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceStatus(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceRetentionChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceReplacementTriggerChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceSelectedAdapterReadinessChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceAdapterLoadBlockerRollup(GatewayRequest) returns (GatewayResponse);
  rpc DryRunHardwareInterfaceOwnerDecisionEvidenceAdapterLoad(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceAdapterLoadDryRunStatus(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceAdapterLoadDryRunAuditConsistency(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceAdapterLoadApprovalAuthorityChecklist(GatewayRequest) returns (GatewayResponse);
  rpc GetHardwareInterfaceOwnerDecisionEvidenceAdapterLoadApprovalAuthorityStatus(GatewayRequest) returns (GatewayResponse);
  rpc GetVehicleSignals(GatewayRequest) returns (GatewayResponse);
  rpc GetVehicleSignalActivation(GatewayRequest) returns (GatewayResponse);
  rpc GetVehicleSignalValidation(GatewayRequest) returns (GatewayResponse);
}

message GatewayRequest {
  string trace_id = 1;
  string caller = 2;
  string permission_context_json = 3;
  string payload_json = 4;
}

message GatewayResponse {
  string trace_id = 1;
  string status = 2;
  string error_json = 3;
  string payload_json = 4;
  repeated string req_ids = 5;
}
