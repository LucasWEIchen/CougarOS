name: Central Brain remote test contract

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/**"
      - ".githooks/**"
      - "central-brain/**"
      - "apk-labs/client2-central-brain/**"
      - "docs/CENTRAL_BRAIN_*"
      - "docs/ui/cockpit-hmi-design/**"
      - "docs/assets/cockpit-hmi-design/**"
      - "tools/*central_brain*"
  pull_request:
    paths:
      - "README.md"
      - ".github/**"
      - ".githooks/**"
      - "central-brain/**"
      - "apk-labs/client2-central-brain/**"
      - "docs/CENTRAL_BRAIN_*"
      - "docs/ui/cockpit-hmi-design/**"
      - "docs/assets/cockpit-hmi-design/**"
      - "tools/*central_brain*"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify remote hardware-test contract
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_revision="${{ github.event.pull_request.base.sha }}"
          else
            base_revision="${{ github.event.before }}"
          fi
          bash tools/check_central_brain_github_publication_tree.sh HEAD
          bash tools/check_central_brain_github_repository_completeness.sh
          bash tools/check_central_brain_github_repository_completeness.sh \
            --changed-range "$base_revision" "$GITHUB_SHA"
          bash tools/check_central_brain_github_remote_testing.sh
          bash tools/check_central_brain_python_prototype_retirement.sh
          bash tools/check_central_brain_aios_stage2_design.sh
          bash tools/check_central_brain_android_sdk_facade.sh
          bash tools/check_central_brain_android_room_v4.sh
          bash tools/check_central_brain_runtime_contract_v2.sh
          bash tools/check_central_brain_android_vehicle_signal_schema.sh
          bash tools/check_central_brain_android_vehicle_capability_catalog.sh
          bash tools/check_central_brain_android_vehicle_digital_twin.sh
          bash tools/check_central_brain_android_context_snapshot.sh
          bash tools/check_central_brain_android_scenario_manifest.sh
          bash tools/check_central_brain_android_scenario_resolver.sh
          bash tools/check_central_brain_android_scenario_plan_compiler.sh
          bash tools/check_central_brain_android_simulated_effect_adapter.sh
          bash tools/check_central_brain_android_simulated_hvac_adapter.sh
          bash tools/check_central_brain_android_simulated_seat_adapter.sh
          bash tools/check_central_brain_android_simulated_media_navigation_adapters.sh
          bash tools/check_central_brain_android_debug_simulation_controller.sh
          bash tools/check_central_brain_android_agent_graph_runtime.sh
          bash tools/check_central_brain_android_typed_node_executors.sh
          bash tools/check_central_brain_android_checkpoint_serializer.sh
          bash tools/check_central_brain_android_retry_timeout_policy.sh
          bash tools/check_central_brain_android_approval_interrupt.sh
          bash tools/check_central_brain_android_effect_coordinator.sh
          bash tools/check_central_brain_android_effect_verification.sh
          bash tools/check_central_brain_android_compensation_undo.sh
          bash tools/check_central_brain_android_graph_restart_recovery.sh
          bash tools/check_central_brain_android_client2_hmi_reducer.sh
          bash tools/check_central_brain_android_client2_intent_shell.sh
          bash tools/check_central_brain_android_client2_hvac_surface.sh
          bash tools/check_central_brain_android_client2_seat_surface.sh
          bash tools/check_central_brain_android_client2_execution_timeline.sh
          bash tools/check_central_brain_android_client2_recovery_ux.sh
          bash tools/check_central_brain_android_client2_driving_restriction.sh
          bash tools/check_central_brain_android_client2_engineer_simulation.sh
          bash tools/check_central_brain_android_client2_scenario_sync.sh
          bash tools/check_central_brain_android_client2_accessibility_display.sh
          bash tools/check_central_brain_android_client2_p4_acceptance.sh
          bash tools/check_central_brain_android_tool_manifest.sh
          bash tools/check_central_brain_android_tool_registry.sh
          bash tools/check_central_brain_android_tool_rule_solver.sh
          bash tools/check_central_brain_android_tool_executor.sh
          bash tools/check_central_brain_android_skill_package_verifier.sh
          bash tools/check_central_brain_android_working_memory_store.sh
          bash tools/check_central_brain_android_profile_memory_store.sh
          bash tools/check_central_brain_android_episodic_memory_store.sh
          bash tools/check_central_brain_android_context_budget_manager.sh
          bash tools/check_central_brain_android_memory_consent_hmi.sh
          bash tools/check_central_brain_android_event_broker.sh
          bash tools/check_central_brain_android_event_backpressure_qos.sh
          bash tools/check_central_brain_android_trigger_engine.sh
          bash tools/check_central_brain_root_readme.sh
